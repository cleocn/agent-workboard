version: MVP-LITE-v1
owner: AWB-001
managementContract: AWB-WORKITEM-MGMT-v1
templateContract: AWB-MANAGEMENT-v1

roles:
  ORCHESTRATOR: {model: balanced, reasoning: medium}
  PLANNER: {model: frontier, reasoning: high}
  IMPLEMENTER: {model: balanced, reasoning: high}
  REVIEWER: {model: frontier, reasoning: high}

states:
  - DRAFT
  - PLAN_REVIEW_PENDING
  - PLAN_REVIEW_APPROVED
  - IMPLEMENTING
  - IMPLEMENTATION_COMPLETED
  - FINAL_ACCEPTANCE_APPROVED

queues: [CLAIMABLE, CLAIMED, WAITING_HUMAN, HELD, BLOCKED]
priorities: [P0, P1, P2, P3]
taskStates: [NOT_STARTED, IN_PROGRESS, BLOCKED, WAITING_ACCEPTANCE, COMPLETED, CANCELLED]

humanGatePolicy:
  schemaVersion: AWB-AUTO-GATE-v1
  STANDARD:
    default: AUTO_ON_PASS
    explicitOptOut: MANUAL
    stages: [PLAN, FINAL]
    autoRequires:
      PLAN: [mode_STANDARD, state_PLAN_REVIEW_PENDING, queue_CLAIMED,
             active_independent_reviewer_claim, management_envelope_present,
             latest_independent_plan_review_PASS, open_plan_findings_zero,
             held_reason_absent, blocked_reason_absent]
      FINAL: [mode_STANDARD, state_IMPLEMENTATION_COMPLETED, queue_CLAIMED,
              active_independent_reviewer_claim, management_envelope_present,
              latest_independent_final_review_PASS, open_implementation_findings_zero,
              held_reason_absent, blocked_reason_absent, required_tasks_completed,
              implementation_quality_baseline_PASS]
    autoEvent: {type: AUTO_GATE_APPROVED, actorKind: SYSTEM, actorId: auto-gate}
    neverGrants: [remote_write, publish, deploy, delete, destructive_action]
  READ_ONLY_DIAGNOSIS: {policy: MANUAL, plan: optional, final: not_applicable}

creationRiskPolicy:
  protocol: AWB-CREATION-RISK-v1
  kinds: [REMOTE, DESTRUCTIVE, ANOMALOUS_STATE]
  riskRequiresExplicitChoice: [AUTO_ON_PASS, MANUAL]
  unanswered: zero_create_zero_side_effect
  negativeDeclarationsDoNotTrigger: [outOfScope, authorization.forbidden]
  ambiguousActualState: ANOMALOUS_STATE

transitions:
  submit_plan:
    from: DRAFT
    to: PLAN_REVIEW_PENDING
    actor: PLANNER
    requires: [active_work_item_claim, planning_tasks_completed]
  agent_approve_plan:
    from: PLAN_REVIEW_PENDING
    to: {AUTO_ON_PASS: PLAN_REVIEW_APPROVED, MANUAL: PLAN_REVIEW_PENDING}
    actor: REVIEWER
    requires:
      AUTO_ON_PASS: [mode_STANDARD, queue_CLAIMED, active_independent_reviewer_claim,
                     management_envelope_present, latest_independent_plan_review_PASS,
                     open_plan_findings_zero, held_reason_absent, blocked_reason_absent]
    autoEvent: {type: AUTO_GATE_APPROVED, actorKind: SYSTEM, actorId: auto-gate, stage: PLAN}
    queueAfter: {AUTO_ON_PASS: CLAIMABLE, MANUAL: WAITING_HUMAN}
  agent_reject_plan:
    from: PLAN_REVIEW_PENDING
    to: DRAFT
    actor: REVIEWER
    queueAfter: CLAIMABLE
  human_approve_plan:
    from: PLAN_REVIEW_PENDING
    to: PLAN_REVIEW_APPROVED
    actor: HUMAN
    requires: [latest_agent_plan_review_approved]
  human_reject_plan:
    from: PLAN_REVIEW_PENDING
    to: DRAFT
    actor: HUMAN
  start_implementation:
    from: PLAN_REVIEW_APPROVED
    to: IMPLEMENTING
    actor: IMPLEMENTER
    requires: [active_work_item_claim]
  submit_implementation:
    from: IMPLEMENTING
    to: IMPLEMENTATION_COMPLETED
    actor: IMPLEMENTER
    requires: [implementation_tasks_completed, local_tests_passed]
  agent_approve_final:
    from: IMPLEMENTATION_COMPLETED
    to: {AUTO_ON_PASS: FINAL_ACCEPTANCE_APPROVED, MANUAL: IMPLEMENTATION_COMPLETED}
    actor: REVIEWER
    requires:
      AUTO_ON_PASS: [mode_STANDARD, queue_CLAIMED, active_independent_reviewer_claim,
                     management_envelope_present, latest_independent_final_review_PASS,
                     open_implementation_findings_zero, held_reason_absent,
                     blocked_reason_absent, required_tasks_completed,
                     implementation_quality_baseline_PASS]
    autoEvent: {type: AUTO_GATE_APPROVED, actorKind: SYSTEM, actorId: auto-gate, stage: FINAL}
    queueAfter: {AUTO_ON_PASS: HELD, MANUAL: WAITING_HUMAN}
  agent_reject_final:
    from: IMPLEMENTATION_COMPLETED
    to: IMPLEMENTING
    actor: REVIEWER
    queueAfter: CLAIMABLE
  human_approve_final:
    from: IMPLEMENTATION_COMPLETED
    to: FINAL_ACCEPTANCE_APPROVED
    actor: HUMAN
    requires: [latest_agent_final_review_approved]
    queueAfter: HELD
  human_reject_final:
    from: IMPLEMENTATION_COMPLETED
    to: IMPLEMENTING
    actor: HUMAN
    queueAfter: CLAIMABLE

claimPolicy:
  oneActiveClaimPerWorkItem: true
  leaseSeconds: 900
  expiredClaimMayBeReacquired: true
  generationMustIncrease: true

orchestratorCoordinationPolicy:
  protocol: AWB-ORCHESTRATOR-v1
  oneActiveLeasePerWorkItem: true
  differentWorkItemsMayHaveDifferentOwners: true
  explicitClaimAndClaimNextShareEligibility: true
  claimNextOrder: [priority_P0_to_P3, updated_at, work_item_id]
  mutationsRequireRequestId: true
  exactReplayIsZeroWrite: true
  generationFenceRequiredAfterFirstLeaseHistory: true
  legacyNoFenceOnlyWhen: [extension_absent, work_item_zero_lease_history]
  recoverNeverChangesAgentClaim: true
  hostProcessManagement: false

repositoryWritePolicy:
  oneActiveWriterPerRepository: true
  roles: [PLANNER, IMPLEMENTER]
  releaseBeforeReview: true

holdPolicy:
  supportedInEveryNonTerminalState: true
  heldItemsAreNotDispatchable: true
  resumeRestoresPriorQueueOrRecomputesSafely: true

reviewPolicy:
  plannerCannotReviewOwnPlan: true
  implementerCannotReviewOwnDelivery: true
  oneBatchReviewAfterImplementationTasks: true
  noPerTaskIndependentReview: true
  findingProtocol: AWB-REVIEW-v1
  blockingFindingRequiredFields: [id, stage, violatedContract, evidence, impact, closeCondition]
  suggestionsCannotRevise: true
  laterReviewScope: [open_findings, direct_revision_regressions, newly_available_evidence]
  stagesIndependent: true
  rounds:
    ordinary: [1, 2, 3, 5]
    convergence: 4
    maximum: 5
    afterThirdRevise: freeze_and_convergence_review
    afterConvergenceRevise: one_minimal_author_revision
    afterFifthRevise: WAITING_HUMAN
  convergenceResults: [PASS, CONVERGENCE_REVISE, WAITING_HUMAN, BLOCKED]

managementPolicy:
  runtimeAuthority: sqlite_projection
  createRequiresCompleteEnvelope: true
  createEnvelopeAndTasksAtomic: true
  historicalReadWithoutEnvelope: true
  backfillBeforeReopenOrExpansion: true
  amendmentsAreAppendOnlyEvents: true
  humanAuthorizationRequiredForScopeAuthorizationAcceptanceExpansion: true
  oneInProgressTaskPerWorkItem: true
  defaultProgress: required_completed_over_required_total
  weightedProgress: {type: FE, explicit: true, stableStageIds: true, weightsTotal: 100}

implementationQualityPolicy:
  baselineFields: [passedAcceptance, tests, modifiedScope, knownNonBlockingIssues,
                   addressedFindingIds, complexityChanges, regressions]
  stopOn: [acceptance_regression, test_weakening, same_or_worse_defect,
           material_scope_expansion, plan_invalid]
  planDeviation: {state: DRAFT, queue: BLOCKED, role: PLANNER, resetReviewRounds: false}

phase2Only:
  - mysql_storage_adapter
  - authenticated_remote_command_ingress
  - pause_resume_and_steer

notPlannedUnlessEvidenceRequiresIt:
  - process_quiescence_proofs
  - cryptographic_git_snapshot_binding
  - adversarial_database_tamper_resistance
  - distributed_projection_recovery
